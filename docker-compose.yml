services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3000"
      ADMIN_PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: dev-admin-key
      LOG_LEVEL: debug
      PAYMENT_GATEWAY_API_KEY: ""
      PAYMENT_GATEWAY_BASE_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orderly

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - orderly

  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - orderly

  # ── Observability profile ──
  # Start with: docker-compose --profile observability up
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "4318:4318" # OTLP HTTP
    networks:
      - orderly

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - orderly

volumes:
  pgdata:
  redisdata:

networks:
  orderly:
    driver: bridge
