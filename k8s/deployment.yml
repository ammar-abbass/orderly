apiVersion: v1
kind: Namespace
metadata:
  name: orderly-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderly
  namespace: orderly-dev
  labels:
    app: orderly
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero-downtime deploys
  selector:
    matchLabels:
      app: orderly
  template:
    metadata:
      labels:
        app: orderly
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: orderly
          image: orderly:latest
          imagePullPolicy: IfNotPresent # Critical for local dev
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: admin
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: ADMIN_PORT
              value: '3001'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orderly-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: orderly-secrets
                  key: redis-url
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orderly-secrets
                  key: admin-api-key
            - name: PAYMENT_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orderly-secrets
                  key: payment-gateway-api-key
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '1000m'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give the load balancer time to stop routing before shutdown
                command: ['/bin/sh', '-c', 'sleep 15']

---
apiVersion: v1
kind: Service
metadata:
  name: orderly
  namespace: orderly-dev
spec:
  selector:
    app: orderly
  ports:
    - port: 80
      targetPort: 3000
      name: http
    - port: 81
      targetPort: 3001
      name: admin
  type: NodePort


